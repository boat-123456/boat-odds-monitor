name: Test notification

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Send test notification
        run: |
          curl \
            -H "Title: 競艇監視テスト" \
            -H "Priority: high" \
            -d "iPhoneへの通知テストです" \
            "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"
